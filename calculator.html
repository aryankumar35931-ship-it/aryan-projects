<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aryan's Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1120;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.calculator {
    width: 340px;
    background: #172033;
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 15px 40px #0006;
}

h1 {
    text-align: center;
    color: #38bdf8;
    margin-bottom: 20px;
    font-size: 24px;
}

#display {
    width: 100%;
    height: 65px;
    background: #0b1120;
    border: 1px solid #334155;
    border-radius: 10px;
    color: white;
    text-align: right;
    font-size: 28px;
    padding: 12px;
    margin-bottom: 16px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 55px;
    border: none;
    border-radius: 10px;
    background: #334155;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    background: #475569;
}

.operator {
    background: #0369a1;
}

.clear {
    background: #dc2626;
}

.equal {
    background: #059669;
    grid-column: span 2;
}

.zero {
    grid-column: span 2;
}

button:active {
    transform: scale(0.96);
}
</style>
</head>

<body>

<div class="calculator">
    <h1>Aryan Calculator</h1>

    <input id="display" type="text" value="0"
           readonly aria-label="Calculator display">

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="chooseOperator('%')">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="zero" onclick="addNumber('0')">0</button>
        <button onclick="addNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
const display = document.getElementById("display");

let firstNumber = null;
let operator = null;
let waitingForSecond = false;

function addNumber(number) {
    if (waitingForSecond) {
        display.value = number === "." ? "0." : number;
        waitingForSecond = false;
        return;
    }

    if (number === ".") {
        if (display.value.includes(".")) return;
        display.value += ".";
        return;
    }

    if (display.value === "0") {
        display.value = number;
    } else {
        display.value += number;
    }
}

function chooseOperator(op) {
    const current = Number(display.value);

    if (operator && !waitingForSecond) {
        calculate();
    }

    firstNumber = Number(display.value);
    operator = op;
    waitingForSecond = true;
}

function calculate() {
    if (operator === null || waitingForSecond) return;

    const secondNumber = Number(display.value);
    let result;

    switch (operator) {
        case "+":
            result = firstNumber + secondNumber;
            break;
        case "-":
            result = firstNumber - secondNumber;
            break;
        case "*":
            result = firstNumber * secondNumber;
            break;
        case "/":
            if (secondNumber === 0) {
                display.value = "Cannot divide by zero";
                firstNumber = null;
                operator = null;
                waitingForSecond = true;
                return;
            }
            result = firstNumber / secondNumber;
            break;
        case "%":
            result = firstNumber % secondNumber;
            break;
        default:
            return;
    }

    display.value = String(
        Math.round((result + Number.EPSILON) * 1e10) / 1e10
    );

    firstNumber = null;
    operator = null;
    waitingForSecond = true;
}

function clearDisplay() {
    display.value = "0";
    firstNumber = null;
    operator = null;
    waitingForSecond = false;
}

function deleteLast() {
    if (waitingForSecond) return;

    display.value = display.value.length > 1
        ? display.value.slice(0, -1)
        : "0";
}
</script>

</body>
</html>
